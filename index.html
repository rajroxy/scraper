<!DOCTYPE html>
<html>
<head>
  <title>Configure Custom Stream Addon</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 2rem; max-width: 450px; margin: auto; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 10px; }
    button { width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .url-box { margin-top: 15px; background: #0f172a; padding: 10px; border-radius: 6px; word-break: break-all; font-family: monospace; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Addon Configuration</h2>
    <label><input type="checkbox" id="p1" checked> Enable Primary Source (Vidsrc/Direct)</label><br><br>
    <label><input type="checkbox" id="p2" checked> Enable Backup Sources</label><br><br>
    
    <button onclick="generateLink()">Generate Manifest Link</button>
    <div id="result" class="url-box" style="display:none;"></div>
  </div>

  <script>
    function generateLink() {
      const config = "providers=p1,p2";
      const manifestUrl = `${window.location.origin}/${config}/manifest.json`;
      const out = document.getElementById('result');
      out.style.display = 'block';
      out.innerHTML = `<strong>Your Addon URL:</strong><br>${manifestUrl}`;
    }
  </script>
</body>
</html>
